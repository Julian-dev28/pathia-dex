name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The solver maths needs no network, so it runs first and fails fast.
      - run: npm run test:unit
      - run: npm run build

  chain-constants:
    name: Verify addresses and tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A wrong address is the cheapest bug to ship and the cheapest to catch.
      # A wrong `decimals` is the most expensive, and just as cheap to catch.
      - run: npm run verify:addresses
      - run: npm run verify:tokens

  contracts:
    name: Fork tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      # forge-std is not vendored, so fetch it rather than committing a
      # dependency into the repo.
      - run: forge install foundry-rs/forge-std --no-git
        working-directory: contracts
      # The fixture pins a block, and public Base endpoints do not serve deep
      # history, so it is regenerated against head rather than committed stale.
      - run: npm run predict
      - run: forge test -vv
        working-directory: contracts
        env:
          BASE_RPC_URL: https://mainnet.base.org
